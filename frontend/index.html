<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Information System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Hospital Information System</h1>

    <div class="container">
        <h2>Register New Patient</h2>
        <form id="register-patient-form">
            <div class="form-group">
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            <div class="form-group">
                <label for="date_of_birth">Date of Birth:</label>
                <input type="date" id="date_of_birth" name="date_of_birth" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="phone_number">Phone Number:</label>
                <input type="tel" id="phone_number" name="phone_number">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <textarea id="address" name="address"></textarea>
            </div>
            <button type="submit">Register Patient</button>
        </form>
        <div id="response"></div>
    </div>

    <div class="container">
        <h2>Patient List</h2>
        <table id="patient-list-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>DOB</th>
                    <th>Gender</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="patient-list-body">
                <!-- Patient rows will be inserted here by JavaScript -->
            </tbody>
        </table>
    </div>

<!-- The Modal for Package Management -->
<div id="package-modal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h2 id="modal-patient-name">Manage Packages for...</h2>
    <input type="hidden" id="modal-patient-id">

    <h3>Current Packages</h3>
    <div id="current-packages-list">
        <!-- Patient's active packages will be listed here -->
    </div>

    <hr>

    <h3>Assign New Package</h3>
    <form id="assign-package-form">
        <div class="form-group">
            <label for="package-select">Select a Package:</label>
            <select id="package-select" name="package_id" required>
                <!-- Available packages will be populated here -->
            </select>
        </div>
        <button type="submit">Assign Package</button>
    </form>
    <div id="modal-response"></div>
  </div>
</div>

    <script src="js/main.js"></script>

    <div id="vitals-form-container" class="container" style="display: none;">
        <h2>Record Vitals for OP Number: <span id="vitals-op-number"></span></h2>
        <form id="vitals-form">
            <input type="hidden" id="vitals-op-id" name="op_id">
                <input type="hidden" id="vitals-patient-id" name="patient_id">
            <div class="form-group">
                <label for="temperature">Temperature (°C):</label>
                <input type="number" step="0.1" id="temperature" name="temperature" required>
            </div>
            <div class="form-group">
                <label for="blood_pressure">Blood Pressure (e.g., 120/80):</label>
                <input type="text" id="blood_pressure" name="blood_pressure" required>
            </div>
            <div class="form-group">
                <label for="heart_rate">Heart Rate (bpm):</label>
                <input type="number" id="heart_rate" name="heart_rate" required>
            </div>
            <div class="form-group">
                <label for="respiratory_rate">Respiratory Rate (breaths/min):</label>
                <input type="number" id="respiratory_rate" name="respiratory_rate" required>
            </div>
            <button type="submit">Save Vitals</button>
        </form>
            <div id="billing-container" style="display: none; margin-top: 20px;">
                <hr>
                <p>Vitals saved. Ready for next action.</p>
                <button id="bill-consultation-btn">Bill for Consultation</button>
            </div>
    </div>

</body>
</html>
