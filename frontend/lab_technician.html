<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Technician Dashboard - HIS</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth_check.js" defer></script>
</head>
<body>
    <h1>Lab Technician Dashboard</h1>
    <nav>
        <a href="index.html">Patient Management</a>
        <a href="admin.html">Admin</a>
        <a href="doctor.html">Doctor Dashboard</a>
        <a href="lab_technician.html">Lab Dashboard</a>
    </nav>

    <div class="container">
        <h2>Pending Lab Tests</h2>
        <table id="pending-tests-table">
            <thead>
                <tr>
                    <th>Test ID</th>
                    <th>Patient Name</th>
                    <th>Test Name</th>
                    <th>Ordered On</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="pending-tests-body">
                <!-- Pending tests will be populated by JavaScript -->
            </tbody>
        </table>
    </div>

    <div id="result-entry-section" class="container" style="display: none;">
        <h2>Enter Result for Test ID: <span id="result-test-id"></span></h2>
        <form id="result-entry-form">
            <input type="hidden" id="result-lab-test-id" name="lab_test_id">
            <div class="form-group">
                <label for="result">Result:</label>
                <textarea id="result" name="result" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="notes">Notes:</label>
                <textarea id="notes" name="notes" rows="2"></textarea>
            </div>
            <button type="submit">Save Result</button>
        </form>
        <div id="result-response"></div>
    </div>

    <script src="js/lab_technician.js"></script>
</body>
</html>
